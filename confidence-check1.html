<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confidence check</title>

<script>
/* ============================================================
   CONFIG — edit this block only.

   Use the SAME file twice in a course. Set mode to "start" on the
   opening page and "end" on the closing page. The end version shows
   the learner how their answer moved.
   ============================================================ */
const CONFIG = {
  mode: "start",          /* "start" or "end" */

  question: "",           /* heading lives in the Create text field above */
  hint:     "",

  accessibleName: "How confident do you feel in your ability to support someone experiencing a mental health concern or emotional distress? Choose one of five levels.",

  levels: [
    "Not at all confident",
    "Slightly confident",
    "Moderately confident",
    "Confident",
    "Very confident"
  ],

  buttonLabel: "Submit",
  changeLabel: "Change my answer",

  msgRecorded: "Thanks, that\u2019s noted.",

  /* End-of-course wording. {before} and {now} are replaced. */
  endUp:    "You started this course at \u201c{before}\u201d. You\u2019re now at \u201c{now}\u201d.",
  endSame:  "You started this course at \u201c{before}\u201d, and you\u2019re still there. That\u2019s worth sitting with \u2014 confidence often moves after you\u2019ve used something, not after you\u2019ve read it.",
  endDown:  "You started this course at \u201c{before}\u201d and you\u2019re now at \u201c{now}\u201d. Knowing more about something can make you realise how much it asks of you. That\u2019s not a step backwards.",
  endNoData: "No earlier answer found on this device, so there\u2019s nothing to compare against this time."
};
</script>

<style>
/* ============================================================
   BRAND TOKENS — swap for FIFA Medical Network colours.
   ============================================================ */
:root {
  --paper:    #F6F5F2;
  --ink:      #17242E;
  --ink-soft: #4A5964;
  --step:     #2F6F7E;   /* the learner's level */
  --before:   #A0522D;   /* their earlier answer */
  --empty:    #DEDCD5;
  --focus:    #17242E;

  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(0.9375rem, 0.92rem + 0.1vw, 1rem);
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.stage {
  max-width: 52rem;
  min-height: 100%;
  margin: 0 auto;
  padding: clamp(0.9rem, 2.5vw, 1.75rem) clamp(1rem, 4vw, 2rem);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(0.75rem, 2.5vw, 1.15rem);
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
  white-space: nowrap; border: 0;
}

.prompt { border: 0; margin: 0; padding: 0; min-width: 0; }

.visible-heading {
  margin: 0;
  font-size: clamp(1.15rem, 1rem + 0.75vw, 1.6rem);
  font-weight: 600; line-height: 1.2; letter-spacing: -0.01em;
  max-width: 38ch;
}

.hint { margin: 0.5rem 0 0; color: var(--ink-soft); }

/* ---------- The steps ----------
   Five rising blocks rather than a track and thumb, so it reads as
   levels rather than a measurement. */

.steps {
  display: flex;
  align-items: flex-end;
  gap: clamp(0.3rem, 1.2vw, 0.6rem);
}

.step {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: flex-end;
  cursor: pointer;
  border-radius: 0.3rem;
  padding-bottom: 0.15rem;
}

.step input {
  position: absolute;
  opacity: 0;
  width: 100%; height: 100%;
  margin: 0; cursor: pointer;
}

.bar {
  width: 100%;
  border-radius: 0.25rem 0.25rem 0 0;
  background: var(--empty);
  transition: background 260ms ease, transform 260ms cubic-bezier(.34,.62,.28,1);
  transform-origin: bottom;
}

/* Rising heights, so the shape itself conveys the scale */
.step:nth-child(1) .bar { height: clamp(1.6rem, 5vw, 2.6rem); }
.step:nth-child(2) .bar { height: clamp(2.3rem, 7vw, 3.8rem); }
.step:nth-child(3) .bar { height: clamp(3.0rem, 9vw, 5.0rem); }
.step:nth-child(4) .bar { height: clamp(3.7rem, 11vw, 6.2rem); }
.step:nth-child(5) .bar { height: clamp(4.4rem, 13vw, 7.4rem); }

.step.filled .bar { background: var(--step); }

.step:focus-within { outline: 3px solid var(--focus); outline-offset: 3px; }

/* Their earlier answer, marked on the same scale */
.step.was::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -0.55rem;
  width: 0.6rem; height: 0.6rem;
  border-radius: 50%;
  background: var(--before);
  transform: translateX(-50%);
}

.scale-labels {
  display: flex;
  gap: clamp(0.3rem, 1.2vw, 0.6rem);
  margin-top: 0.9rem;
}

.scale-labels span {
  flex: 1 1 0;
  min-width: 0;
  font-size: 0.78em;
  line-height: 1.25;
  color: var(--ink-soft);
  text-align: center;
  hyphens: auto;
}

/* Below 30rem the five labels can't fit, so only the chosen one shows */
@media (max-width: 30rem) {
  .scale-labels { display: none; }
}

.chosen {
  margin: 0;
  min-height: 1.6em;
  font-weight: 600;
  font-size: clamp(1.05rem, 0.95rem + 0.5vw, 1.3rem);
}

.legend {
  margin: 0;
  font-size: 0.85em;
  color: var(--ink-soft);
  display: flex; align-items: center; gap: 0.4rem;
}

.legend i {
  width: 0.6rem; height: 0.6rem; border-radius: 50%;
  background: var(--before); flex: 0 0 auto;
}

.result { margin: 0; max-width: 54ch; }

.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }

button {
  font: inherit; font-weight: 600;
  color: var(--paper); background: var(--ink);
  border: 2px solid var(--ink); border-radius: 0.3rem;
  padding: 0.6rem 1.2rem; min-height: 2.6rem; cursor: pointer;
}

button.secondary { color: var(--ink); background: transparent; }
button:hover { opacity: 0.88; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

@media (prefers-contrast: more) {
  .bar { outline: 1px solid var(--ink); }
}
</style>
</head>

<body>
<main class="stage">

  <fieldset class="prompt">
    <legend id="question" class="sr-only"></legend>
    <p class="visible-heading" id="visibleHeading" hidden></p>
    <p class="hint" id="hint" hidden></p>
  </fieldset>

  <div>
    <div class="steps" id="steps" role="radiogroup" aria-labelledby="question"></div>
    <div class="scale-labels" id="scaleLabels" aria-hidden="true"></div>
  </div>

  <p class="chosen" id="chosen" role="status"></p>
  <p class="legend" id="legend" hidden><i></i><span>Where you started</span></p>
  <p class="result" id="result"></p>

  <div class="actions">
    <button type="button" id="submit"></button>
    <button type="button" id="change" class="secondary" hidden></button>
  </div>

</main>

<script>
(function () {
  "use strict";

  const KEY = "fifa-confidence-v1";

  const stepsEl  = document.getElementById("steps");
  const labelsEl = document.getElementById("scaleLabels");
  const chosenEl = document.getElementById("chosen");
  const resultEl = document.getElementById("result");
  const legendEl = document.getElementById("legend");
  const submitBtn = document.getElementById("submit");
  const changeBtn = document.getElementById("change");
  const hint = document.getElementById("hint");

  document.getElementById("question").textContent = CONFIG.accessibleName;
  submitBtn.textContent = CONFIG.buttonLabel;
  changeBtn.textContent = CONFIG.changeLabel;

  const visibleHeading = document.getElementById("visibleHeading");
  if (CONFIG.question) { visibleHeading.textContent = CONFIG.question; visibleHeading.hidden = false; }
  if (CONFIG.hint) { hint.textContent = CONFIG.hint; hint.hidden = false; }

  /* Storage can be blocked in private browsing or by policy, so every
     read and write is guarded. The component still works without it,
     it just can't compare against an earlier answer. */
  function readEarlier() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeAnswer(obj) {
    try { localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) {}
  }

  const earlier = CONFIG.mode === "end" ? readEarlier() : null;
  let choice = null;
  const steps = [];

  /* Native radios: arrow keys, one tab stop and correct screen reader
     semantics all come free. */
  CONFIG.levels.forEach(function (label, i) {
    const wrap = document.createElement("label");
    wrap.className = "step";

    const input = document.createElement("input");
    input.type = "radio";
    input.name = "confidence";
    input.value = String(i + 1);

    const bar = document.createElement("span");
    bar.className = "bar";

    const sr = document.createElement("span");
    sr.className = "sr-only";
    sr.textContent = label;

    wrap.append(input, bar, sr);
    stepsEl.append(wrap);
    steps.push(wrap);

    const cap = document.createElement("span");
    cap.textContent = label;
    labelsEl.append(cap);

    input.addEventListener("change", function () {
      choice = i + 1;
      paint();
    });
  });

  if (earlier && earlier.level) {
    const idx = earlier.level - 1;
    if (steps[idx]) { steps[idx].classList.add("was"); legendEl.hidden = false; }
  }

  function paint() {
    steps.forEach(function (s, i) {
      s.classList.toggle("filled", choice !== null && i < choice);
    });
    chosenEl.textContent = choice === null ? "" : CONFIG.levels[choice - 1];
  }

  submitBtn.addEventListener("click", function () {
    if (choice === null) {
      chosenEl.textContent = "Choose a level first.";
      steps[0].querySelector("input").focus();
      return;
    }

    const label = CONFIG.levels[choice - 1];

    if (CONFIG.mode === "start") {
      writeAnswer({ level: choice, label: label, at: new Date().toISOString() });
      resultEl.textContent = CONFIG.msgRecorded;
    } else {
      if (!earlier || !earlier.level) {
        resultEl.textContent = CONFIG.endNoData;
      } else {
        const tpl = choice > earlier.level ? CONFIG.endUp
                  : choice < earlier.level ? CONFIG.endDown
                  : CONFIG.endSame;
        resultEl.textContent = tpl
          .replace("{before}", earlier.label)
          .replace("{now}", label);
      }
      writeAnswer({ level: earlier ? earlier.level : choice,
                    label: earlier ? earlier.label : label,
                    endLevel: choice, endLabel: label,
                    at: new Date().toISOString() });
    }

    steps.forEach(function (s) { s.querySelector("input").disabled = true; });
    submitBtn.hidden = true;
    changeBtn.hidden = false;
    resultEl.setAttribute("tabindex", "-1");
    resultEl.focus();
  });

  changeBtn.addEventListener("click", function () {
    steps.forEach(function (s) { s.querySelector("input").disabled = false; });
    resultEl.textContent = "";
    resultEl.removeAttribute("tabindex");
    changeBtn.hidden = true;
    submitBtn.hidden = false;
    steps[Math.max(0, (choice || 1) - 1)].querySelector("input").focus();
  });

  paint();
})();
</script>
</body>
</html>
