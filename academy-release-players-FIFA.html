/* ============================================================
   BRAND TOKENS
   ============================================================ */
:root {
  --paper:     #FFFFFF;   /* White */
  --ink:       #004D8C;   /* all text - the theme's white-background pairing.
                             Swap to #4D4F53 if course body copy is dark grey. */
  --ink-soft:  #4D4F53;   /* FIFA Dark Grey - secondary text */
  --button:    #12355E;   /* matches the theme button colour exactly */
  --tile:      #E6EBF1;   /* a player at rest */
  --tile-on:   #004D8C;   /* selected, and the one who made it */
  --focus:     #12355E;

  --font: "Open Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(0.9375rem, 0.92rem + 0.1vw, 1rem);
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.stage {
  max-width: 52rem;
  min-height: 100%;
  margin: 0 auto;
  padding: clamp(0.9rem, 2.5vw, 1.75rem) clamp(1rem, 4vw, 2rem);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(0.9rem, 2.5vw, 1.4rem);
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ---------- Question ---------- */

.prompt { border: 0; margin: 0; padding: 0; min-width: 0; }

.visible-heading {
  margin: 0;
  font-size: clamp(1.15rem, 1rem + 0.75vw, 1.6rem);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
  max-width: 34ch;
}

.hint { margin: 0.5rem 0 0; color: var(--ink-soft); }

/* Once revealed, any visible heading is redundant - the result carries
   it. The hidden label stays, so the group keeps its accessible name. */
.revealed .visible-heading,
.revealed .hint { display: none; }

/* ---------- The ten tiles ----------
   Five across, two down, at every width. Tile proportion and the gaps
   between tiles are taken from the designer's layout: a 272 x 378 tile,
   a horizontal gap of 21% of tile width and a vertical gap of 22.5% of
   tile height. Expressed in cqw so they hold at any frame size. */

.squad {
  container-type: inline-size;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1.2rem 0.9rem;            /* fallback where cqw is unsupported */
  gap: 5.35cqw 3.59cqw;
}

.figure {
  position: relative;
  aspect-ratio: 272 / 378;
  background: var(--tile);
  cursor: pointer;
  transition: background-color 240ms ease;
}

.figure input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%; height: 100%;
  margin: 0;
  cursor: pointer;
}

.figure img {
  display: block;
  width: 100%; height: 100%;
  /* The artwork is cropped to the tile with the feet on the bottom edge,
     so anchor it there and let any rounding be cropped, not letterboxed. */
  object-fit: cover;
  object-position: 50% 100%;
  pointer-events: none;
  user-select: none;
}

.figure.in-guess,
.figure.made { background: var(--tile-on); }

.figure:has(input:focus-visible) {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

.tally {
  margin: 0;
  min-height: 1.45em;
  text-align: center;
  font-weight: 600;
  font-size: clamp(1.05rem, 0.9rem + 0.7vw, 1.65rem);
  font-variant-numeric: tabular-nums;
}

/* ---------- Revealed layout ----------
   The one who made it becomes a tall tile on the left, the nine who
   were released compact into a 3 x 3 block beside it, and the text
   takes the remaining width. Ratios are the designer's: 440 : 141 tile
   widths, and a figures-to-text split of 888 : 709. */

.reveal-row { display: grid; gap: clamp(0.9rem, 3vw, 1.75rem); }

@media (min-width: 46rem) {
  .revealed .reveal-row {
    grid-template-columns: minmax(0, 888fr) minmax(0, 709fr);
    column-gap: 6.9%;
    align-items: center;
  }
}

.revealed .squad {
  grid-template-columns: 3.12fr repeat(3, minmax(0, 1fr));
  gap: 0.4rem;
  gap: 1.35cqw;
}

.revealed .figure.made {
  grid-column: 1;
  grid-row: 1 / span 3;
  aspect-ratio: auto;
}

/* The nine settle in sequence, each a beat after the last, so the eye
   follows the release rather than seeing it all snap at once. */
.revealed .figure.released {
  animation: settle 360ms ease both var(--stagger, 0ms);
}

@keyframes settle {
  from { opacity: 0.25; transform: translateY(0.35rem); }
  to   { opacity: 1;    transform: translateY(0); }
}

/* The text fades and rises in after the figures have moved, so the
   result lands second. */
.result {
  opacity: 0;
  transform: translateY(0.5rem);
}

.revealed .result {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 420ms ease 560ms, transform 420ms ease 560ms;
}

.result:focus { outline: none; }

.result:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 6px;
}

.result h2 {
  margin: 0 0 0.6rem;
  font-size: clamp(1.4rem, 1.15rem + 1.1vw, 1.9rem);
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -0.015em;
}

.result p { max-width: 34ch; margin: 0 0 0.75rem; }
.result p:last-child { margin-bottom: 0; }

/* ---------- Buttons ---------- */

.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; }

button {
  font: inherit;
  font-weight: 600;
  font-size: 0.875rem;      /* 14px, matching the theme */
  color: var(--paper);
  background: var(--button);
  border: 2px solid var(--button);
  border-radius: 32px;      /* matching the theme's corner radius */
  min-height: 2.6rem;
  padding: 0.6rem 1.2rem;
  cursor: pointer;
}

button.secondary { color: var(--ink); background: transparent; }
button:hover { opacity: 0.88; }

button:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    transition-delay: 0ms !important;
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
  }
}
</style>
</head>

<body>
<main class="stage">

  <fieldset class="prompt">
    <legend id="question" class="sr-only"></legend>
    <p class="visible-heading" id="visibleHeading" hidden></p>
    <p class="hint" id="hint" hidden></p>
  </fieldset>

  <div class="reveal-row">
    <div class="squad" id="squad" role="radiogroup" aria-labelledby="question"></div>

    <section class="result" id="result" tabindex="-1" hidden aria-labelledby="resultHeading">
      <h2 id="resultHeading"></h2>
      <p id="resultBody"></p>
      <p id="resultClose"></p>
    </section>
  </div>

  <p class="tally" id="tally" role="status"></p>

  <div class="actions">
    <button type="button" id="reveal"></button>
    <button type="button" id="reset" class="secondary" hidden></button>
  </div>

</main>

<script>
(function () {
  "use strict";

  const squad     = document.getElementById("squad");
  const tally     = document.getElementById("tally");
  const revealBtn = document.getElementById("reveal");
  const resetBtn  = document.getElementById("reset");
  const result    = document.getElementById("result");
  const hint      = document.getElementById("hint");

  /* Hidden label always present; visible heading only if configured. */
  document.getElementById("question").textContent = CONFIG.accessibleName;

  const visibleHeading = document.getElementById("visibleHeading");
  if (CONFIG.question) {
    visibleHeading.textContent = CONFIG.question;
    visibleHeading.hidden = false;
  }
  if (CONFIG.hint) {
    hint.textContent = CONFIG.hint;
    hint.hidden = false;
  }
  revealBtn.textContent = CONFIG.buttonLabel;
  resetBtn.textContent  = CONFIG.resetLabel;

  let guess = null;
  let revealed = false;
  const figures = [];

  /* Native radios: arrow-key navigation, one tab stop and correct
     screen-reader semantics all come free. */
  for (let n = 1; n <= CONFIG.total; n++) {
    const label = document.createElement("label");
    label.className = "figure";

    const input = document.createElement("input");
    input.type = "radio";
    input.name = "guess";
    input.value = String(n);

    const text = document.createElement("span");
    text.className = "sr-only";
    text.textContent = n === 1 ? "1 player" : n + " players";

    /* Decorative: the count in the hidden label carries the meaning, so
       the artwork is not announced. */
    const img = document.createElement("img");
    img.src = CONFIG.players[n - 1];
    img.alt = "";
    img.draggable = false;

    label.append(input, img, text);
    squad.append(label);
    figures.push(label);

    input.addEventListener("change", function () {
      guess = n;
      paintGuess();
    });
  }

  function paintGuess() {
    figures.forEach(function (fig, i) {
      fig.classList.toggle("in-guess", guess !== null && i < guess);
    });
    tally.textContent = guess === null ? "" :
      CONFIG.tally.replace("{n}", guess).replace("{total}", CONFIG.total);
  }

  function reveal() {
    if (revealed) return;
    revealed = true;

    /* Which player remains is drawn at random. It could have been any
       of them, and the visual should say so. */
    const remain = new Set();
    while (remain.size < CONFIG.answer) {
      remain.add(Math.floor(Math.random() * CONFIG.total));
    }

    document.body.classList.add("revealed");

    let step = 0;
    figures.forEach(function (fig, i) {
      fig.classList.remove("in-guess");
      if (remain.has(i)) {
        fig.classList.add("made");
      } else {
        fig.style.setProperty("--stagger", (step++ * 60) + "ms");
        fig.classList.add("released");
      }
      fig.querySelector("input").disabled = true;
    });

    document.getElementById("resultHeading").textContent = CONFIG.resultHeading;
    document.getElementById("resultBody").textContent    = CONFIG.resultBody;
    document.getElementById("resultClose").textContent   = CONFIG.resultClose;

    tally.hidden  = true;
    result.hidden = false;
    revealBtn.hidden = true;
    resetBtn.hidden  = false;

    /* Land keyboard and screen-reader users on the outcome rather than
       leaving them to hunt for what changed. */
    result.focus();
  }

  function reset() {
    revealed = false;
    guess = null;

    document.body.classList.remove("revealed");

    figures.forEach(function (fig) {
      fig.classList.remove("made", "released", "in-guess");
      fig.style.removeProperty("--stagger");
      const input = fig.querySelector("input");
      input.disabled = false;
      input.checked = false;
    });

    result.hidden = true;
    resetBtn.hidden = true;
    revealBtn.hidden = false;
    if (CONFIG.hint) hint.hidden = false;
    tally.hidden = false;
    tally.textContent = "";
    figures[0].querySelector("input").focus();
  }

  revealBtn.addEventListener("click", reveal);
  resetBtn.addEventListener("click", reset);
})();
</script>
</body>
</html>
