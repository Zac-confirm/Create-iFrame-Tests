/* ============================================================
   BRAND TOKENS
   ============================================================ */
:root {
  --paper:    #FFFFFF;   /* White */
  --ink:      #004D8C;   /* all text - the theme's white-background pairing.
                            Swap to #4D4F53 if course body copy is dark grey. */
  --ink-soft: #4D4F53;   /* FIFA Dark Grey - secondary text */
  --button:   #12355E;   /* matches the theme button colour exactly */
  --panel:    #E6EBF1;   /* the designer's panel */
  --fill:     #004D8C;   /* track, up to the thumb */
  --rail:     #C1CADE;   /* track, beyond the thumb */
  --badge:    #72145E;   /* the readout block */
  --focus:    #12355E;

  /* Thumb diameter. The mark positions are worked out from this, so the
     marks and the track fill line up with the native thumb. */
  --thumb: 1.65rem;
  --dot:   1.75rem;

  --font: "Open Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(0.9375rem, 0.92rem + 0.1vw, 1rem);
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.stage {
  max-width: 52rem;
  min-height: 100%;
  margin: 0 auto;
  padding: clamp(0.9rem, 2.5vw, 1.75rem) clamp(1rem, 4vw, 2rem);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(0.85rem, 2.5vw, 1.4rem);
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ---------- Question ---------- */

.prompt { border: 0; margin: 0; padding: 0; min-width: 0; }

.visible-heading {
  margin: 0;
  font-size: clamp(1.15rem, 1rem + 0.75vw, 1.6rem);
  font-weight: 600;
  line-height: 1.22;
  letter-spacing: -0.01em;
  max-width: 38ch;
}

.hint { margin: 0.5rem 0 0; color: var(--ink-soft); }

/* Once revealed, any visible heading is redundant - the result carries
   it. The hidden label stays, so the slider keeps its accessible name. */
.revealed .visible-heading,
.revealed .hint { display: none; }

/* ---------- The panel ---------- */

.reveal-row { display: grid; gap: clamp(0.9rem, 3vw, 1.75rem); }

@media (min-width: 46rem) {
  .revealed .reveal-row {
    grid-template-columns: minmax(0, 889fr) minmax(0, 592fr);
    column-gap: 5.3%;
    align-items: center;
  }
}

.panel {
  background: var(--panel);
  min-height: 21rem;
  padding: 3.25rem clamp(1.5rem, 6%, 4.4rem) 1.7rem;
  display: flex;
  flex-direction: column;
}

/* After Submit, the "Actual figure" label hangs below the 0%/100% row.
   Extra bottom padding keeps it clear of the panel's lower edge. */
.revealed .panel { padding-bottom: 3.4rem; }

.badge {
  margin: 0;
  align-self: flex-start;
  min-width: 8rem;
  min-height: 4.9rem;
  padding: 0 0.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--badge);
  color: var(--paper);
  font-size: clamp(2rem, 1.4rem + 2vw, 2.7rem);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}

.scale-block { margin-top: auto; }

/* ---------- Coins ----------
   Ten stacks, one for each 10% step. Each sits directly above the point
   on the track where it appears, so the newest stack is always the one
   over the thumb. On reveal only the two ends stay, which is what makes
   room for the marker labels in the middle. */

.coins {
  position: relative;
  height: 5rem;
}

.stack {
  position: absolute;
  bottom: 0;
  left: var(--pos, 50%);
  width: min(3.25rem, 9%);      /* shrinks on narrow screens so stacks never overlap */
  aspect-ratio: 163 / 247;
  background: bottom center / 100% 100% no-repeat;
  opacity: 0;
  transform: translate(-50%, -0.9rem);
  transition: opacity 140ms ease, transform 140ms ease-in;
  pointer-events: none;
}

.stack.on {
  opacity: 1;
  transform: translate(-50%, 0);
  transition: opacity 180ms ease, transform 320ms cubic-bezier(.3,1.5,.55,1);
}

.revealed .stack { display: none; }

.coin-ends {
  position: absolute;
  inset: 0;
  display: none;
  align-items: flex-end;
  justify-content: space-between;
}

.revealed .coin-ends { display: flex; }

.coin-ends span {
  display: block;
  width: 3.25rem;
  background-repeat: no-repeat;
  background-size: 100% 100%;
}

.coin-low  { aspect-ratio: 162 / 58;  }
.coin-high { aspect-ratio: 162 / 247; }

/* ---------- Slider ---------- */

.track-wrap {
  position: relative;
  margin-top: 1.8rem;
  height: var(--thumb);
  display: flex;
  align-items: center;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  margin: 0;
  background: transparent;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-runnable-track {
  height: 0.45rem;
  background:
    linear-gradient(to right,
      var(--fill) 0 var(--fillpos, 50%),
      var(--rail) var(--fillpos, 50%) 100%);
}

input[type="range"]::-moz-range-track {
  height: 0.45rem;
  background: var(--rail);
}

input[type="range"]::-moz-range-progress {
  height: 0.45rem;
  background: var(--fill);
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: var(--thumb);
  height: var(--thumb);
  margin-top: calc((0.45rem - var(--thumb)) / 2);
  border: 0;
  border-radius: 50%;
  background: center / contain no-repeat;
  background-image: var(--thumbart);
}

input[type="range"]::-moz-range-thumb {
  width: var(--thumb);
  height: var(--thumb);
  border: 0;
  border-radius: 50%;
  background: center / contain no-repeat;
  background-image: var(--thumbart);
}

input[type="range"]:focus-visible { outline: none; }

input[type="range"]:focus-visible::-webkit-slider-thumb {
  box-shadow: 0 0 0 3px var(--focus);
}

input[type="range"]:focus-visible::-moz-range-thumb {
  box-shadow: 0 0 0 3px var(--focus);
}

input[type="range"]:disabled { cursor: default; }
input[type="range"]:disabled::-webkit-slider-thumb { opacity: 0; }
input[type="range"]:disabled::-moz-range-thumb { opacity: 0; }

/* ---------- The two marks ---------- */

.mark {
  position: absolute;
  top: 50%;
  left: var(--pos, 50%);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: center / contain no-repeat;
  opacity: 0;
  transition: opacity 300ms ease 260ms, left 520ms cubic-bezier(.32,.72,.3,1);
  pointer-events: none;
}

.mark-actual { width: var(--dot);   height: var(--dot);   background-image: var(--dotart); }
.mark-guess  { width: var(--thumb); height: var(--thumb); background-image: var(--thumbart); }

.revealed .mark { opacity: 1; }

/* ---------- Labels on the marks ---------- */

.scale {
  display: flex;
  justify-content: space-between;
  margin-top: 1.1rem;
  font-weight: 600;
}

.mark-label {
  position: absolute;
  left: var(--pos, 50%);
  margin: 0;
  font-size: 0.8125rem;
  line-height: 1.2;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 300ms ease 320ms, left 520ms cubic-bezier(.32,.72,.3,1);
  pointer-events: none;
}

.revealed .mark-label { opacity: 1; }

/* A hairline runs from each label to the track it points at. */
.mark-label::after {
  content: "";
  position: absolute;
  left: 50%;
  width: 1px;
  background: var(--rail);
}

.label-guess {
  bottom: calc(100% + 2.1rem);
  transform: translateX(-50%);
}

.label-guess::after { top: 100%; height: 2rem; }

.label-actual {
  top: calc(100% + 3.4rem);
  transform: translateX(-50%);
}

.label-actual::after { bottom: 100%; height: 3.3rem; }

/* ---------- Result ---------- */

.result { opacity: 0; transform: translateY(0.5rem); }

.revealed .result {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 420ms ease 360ms, transform 420ms ease 360ms;
}

.result:focus { outline: none; }

.result:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 6px;
}

.result h2 {
  margin: 0 0 0.6rem;
  font-size: clamp(1.5rem, 1.2rem + 1.3vw, 2rem);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.015em;
}

.result p { max-width: 34ch; margin: 0 0 0.75rem; }
.result p:last-child { margin-bottom: 0; }

/* ---------- Buttons ---------- */

.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; }

button {
  font: inherit;
  font-weight: 600;
  font-size: 0.875rem;      /* 14px, matching the theme */
  color: var(--paper);
  background: var(--button);
  border: 2px solid var(--button);
  border-radius: 32px;      /* matching the theme's corner radius */
  min-height: 2.6rem;
  padding: 0.6rem 1.2rem;
  cursor: pointer;
}

button.secondary { color: var(--ink); background: transparent; }
button:hover { opacity: 0.88; }

button:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    transition-delay: 0ms !important;
  }
}

/* The thumb is white with a soft shadow, which carries no contrast of its
   own against the panel. Give it and the rail a hard edge for anyone who
   has asked for more. */
@media (prefers-contrast: more) {
  :root { --rail: #8D9093; }
  .mark { box-shadow: 0 0 0 2px var(--ink); }
  input[type="range"]::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--ink); }
  input[type="range"]::-moz-range-thumb { box-shadow: 0 0 0 2px var(--ink); }
}
</style>
</head>

<body>
<main class="stage">

  <fieldset class="prompt">
    <legend id="question" class="sr-only"></legend>
    <p class="visible-heading" id="visibleHeading" hidden></p>
    <p class="hint" id="hint" hidden></p>
  </fieldset>

  <div class="reveal-row">
    <div class="panel">
      <p class="badge" aria-hidden="true"><span id="readoutNum">50</span>%</p>

      <div class="scale-block">
        <div class="coins" id="coins" aria-hidden="true">
          <div class="coin-ends">
            <span class="coin-low"  id="coinLow"></span>
            <span class="coin-high" id="coinHigh"></span>
          </div>
        </div>

        <div class="track-wrap">
          <p class="mark-label label-guess"  id="labelGuess"  aria-hidden="true"></p>
          <input type="range" id="slider" min="0" max="100" step="1" value="50"
                 aria-labelledby="question">
          <div class="mark mark-actual" id="markActual" aria-hidden="true"></div>
          <div class="mark mark-guess"  id="markGuess"  aria-hidden="true"></div>
          <p class="mark-label label-actual" id="labelActual" aria-hidden="true"></p>
        </div>

        <div class="scale" aria-hidden="true">
          <span id="scaleLow"></span><span id="scaleHigh"></span>
        </div>
      </div>
    </div>

    <section class="result" id="result" tabindex="-1" hidden aria-labelledby="resultHeading">
      <h2 id="resultHeading"></h2>
      <p id="resultBody"></p>
      <p id="resultClose"></p>
    </section>
  </div>

  <p class="sr-only" id="liveGuess" role="status"></p>

  <div class="actions">
    <button type="button" id="reveal"></button>
    <button type="button" id="reset" class="secondary" hidden></button>
  </div>

</main>

<script>
(function () {
  "use strict";

  const slider      = document.getElementById("slider");
  const readoutNum  = document.getElementById("readoutNum");
  const liveGuess   = document.getElementById("liveGuess");
  const markActual  = document.getElementById("markActual");
  const markGuess   = document.getElementById("markGuess");
  const labelGuess  = document.getElementById("labelGuess");
  const labelActual = document.getElementById("labelActual");
  const revealBtn   = document.getElementById("reveal");
  const resetBtn    = document.getElementById("reset");
  const result      = document.getElementById("result");
  const hint        = document.getElementById("hint");
  const root        = document.documentElement;

  /* Wire the artwork in through custom properties, so CONFIG and ART stay
     the only places anything needs editing. */
  root.style.setProperty("--thumbart", 'url("' + ART.thumb + '")');
  root.style.setProperty("--dotart",   'url("' + ART.dot + '")');
  document.getElementById("coinLow").style.backgroundImage  = 'url("' + ART.coinLow + '")';
  document.getElementById("coinHigh").style.backgroundImage = 'url("' + ART.coinHigh + '")';

  /* Hidden label always present; visible heading only if configured. */
  document.getElementById("question").textContent = CONFIG.accessibleName;

  const visibleHeading = document.getElementById("visibleHeading");
  if (CONFIG.question) {
    visibleHeading.textContent = CONFIG.question;
    visibleHeading.hidden = false;
  }
  if (CONFIG.hint) {
    hint.textContent = CONFIG.hint;
    hint.hidden = false;
  }
  revealBtn.textContent = CONFIG.buttonLabel;
  resetBtn.textContent  = CONFIG.resetLabel;
  labelGuess.textContent  = CONFIG.guessLabel;
  labelActual.textContent = CONFIG.actualLabel;
  document.getElementById("scaleLow").textContent  = CONFIG.scaleLow;
  document.getElementById("scaleHigh").textContent = CONFIG.scaleHigh;

  /* Build the ten stacks. Stack n appears once the guess reaches n x 10%. */
  const coins = document.getElementById("coins");
  const stacks = ART.stacks.map(function (src, i) {
    const el = document.createElement("span");
    el.className = "stack";
    el.style.backgroundImage = 'url("' + src + '")';
    coins.appendChild(el);
    return el;
  });

  let revealed = false;

  /* A native thumb travels between its own half-widths, not the full track,
     so a plain percentage would drift from it. Work the marks and the fill
     out the same way the browser does. */
  function posPct(value) {
    const w = slider.clientWidth;
    const t = markGuess.offsetWidth || 26;
    if (!w) return value + "%";
    return ((t / 2 + (value / 100) * (w - t)) / w * 100) + "%";
  }

  function paint() {
    const v = Number(slider.value);
    readoutNum.textContent = v;
    slider.setAttribute("aria-valuetext", v + " percent");
    slider.style.setProperty("--fillpos", posPct(v));
    stacks.forEach(function (el, i) {
      const step = (i + 1) * 10;
      el.style.setProperty("--pos", posPct(step));
      el.classList.toggle("on", v >= step);
    });
    if (revealed) place();
  }

  function place() {
    const guess  = Number(slider.value);
    const actual = CONFIG.actualPercent;
    markActual.style.setProperty("--pos", posPct(actual));
    labelActual.style.setProperty("--pos", posPct(actual));
    markGuess.style.setProperty("--pos", posPct(guess));
    labelGuess.style.setProperty("--pos", posPct(guess));
  }

  slider.addEventListener("input", paint);
  window.addEventListener("resize", paint);

  slider.addEventListener("change", function () {
    liveGuess.textContent = "Guess set to " + slider.value + " percent.";
  });

  function reveal() {
    if (revealed) return;
    revealed = true;

    place();
    slider.disabled = true;

    const actual = CONFIG.actualPercent;
    document.getElementById("resultHeading").textContent =
      CONFIG.resultHeading.replace("{actual}", actual);
    document.getElementById("resultBody").textContent =
      CONFIG.resultBody.replace(/{actual}/g, actual);
    document.getElementById("resultClose").textContent = CONFIG.resultClose;

    document.body.classList.add("revealed");
    result.hidden = false;
    revealBtn.hidden = true;
    resetBtn.hidden = false;

    /* Land keyboard and screen-reader users on the outcome rather than
       leaving them to hunt for what changed. */
    result.focus();
  }

  function reset() {
    revealed = false;
    slider.disabled = false;
    slider.value = 50;
    paint();

    [markActual, markGuess, labelGuess, labelActual].forEach(function (el) {
      el.style.removeProperty("--pos");
    });

    document.body.classList.remove("revealed");
    if (CONFIG.hint) hint.hidden = false;
    result.hidden = true;
    resetBtn.hidden = true;
    revealBtn.hidden = false;
    liveGuess.textContent = "";
    slider.focus();
  }

  revealBtn.addEventListener("click", reveal);
  resetBtn.addEventListener("click", reset);

  paint();
})();
</script>
</body>
</html>
