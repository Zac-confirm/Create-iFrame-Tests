/* Faint resting places, so it's clear the ball has somewhere to go */
.spot {
  position: absolute;
  width: 0.45rem; height: 0.45rem;
  border-radius: 50%;
  background: var(--ink);
  opacity: 0.18;
  transform: translate(-50%, -50%);
  transition: opacity 200ms ease;
  pointer-events: none;
}

.chosen-level .spot { opacity: 0.1; }

/* Where their earlier answer put it */
.ghost {
  position: absolute;
  width: 0.6rem; height: 0.6rem;
  border-radius: 50%;
  background: var(--before);
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 3px rgba(243,239,231,0.85);
  pointer-events: none;
}

/* THE BALL IS THE CONTROL.
   The button keeps a 24px minimum target however small the ball is
   drawn, which is what WCAG 2.2 asks for. */
.ball {
  position: absolute;
  left: 50.5%;
  top: 75.6%;
  width: max(1.6rem, 7.4%);
  aspect-ratio: 1;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  transform: translate(-50%, -50%);
  cursor: grab;
  transition: left 560ms cubic-bezier(.22,.68,.32,1),
              top 560ms cubic-bezier(.22,.68,.32,1);
  display: grid;
  place-items: center;
}

.ball:active { cursor: grabbing; }
.ball.dragging { transition: none; }

  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  transform: scale(1);
  transition: transform 560ms cubic-bezier(.22,.68,.32,1), opacity 240ms ease;
  opacity: 0.45;
}

.ball.live .skin { opacity: 1; }
.ball.dragging .skin { transition: none; }

.ball:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 4px;
  border-radius: 50%;
}

/* Focusing on pointerdown keeps arrow keys working straight after a
   drag, but mouse users shouldn't be shown a keyboard focus ring. */
.ball.by-pointer:focus-visible { outline: none; }

/* A nudge to show it can be moved, until it has been */
@keyframes hint-nudge {
  0%, 82%, 100% { transform: translateX(0); }
  88%           { transform: translateX(0.28rem); }
  94%           { transform: translateX(0); }
}

.ball:not(.live) .skin { animation: hint-nudge 3.4s ease-in-out infinite; }

.reading {
  margin: 0;
  min-height: 1.6em;
  font-weight: 600;
  font-size: clamp(1.05rem, 0.95rem + 0.55vw, 1.4rem);
  text-align: center;
}

.reading.idle { font-weight: 400; color: var(--ink-soft); font-size: 1em; }

.legend {
  margin: 0; font-size: 0.82em; color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center; gap: 0.4rem;
}
.legend i {
  width: 0.5rem; height: 0.5rem; border-radius: 50%;
  background: var(--before); flex: 0 0 auto;
}

.result { margin: 0 auto; max-width: 54ch; font-size: 0.95em; text-align: center; }

.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }

button.action {
  font: inherit; font-weight: 600;
  color: var(--paper); background: var(--ink);
  border: 2px solid var(--ink); border-radius: 0.3rem;
  padding: 0.55rem 1.1rem; min-height: 2.6rem; cursor: pointer;
}

button.action.secondary { color: var(--ink); background: transparent; }
button.action:hover { opacity: 0.88; }
button.action:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation: none !important;
  }
}

@media (prefers-contrast: more) {
  .spot { opacity: 0.5; }
}
</style>
</head>

<body>
<main class="stage">

  <fieldset class="prompt">
    <legend id="question" class="sr-only"></legend>
    <p class="visible-heading" id="visibleHeading" hidden></p>
    <p class="hint" id="hint" hidden></p>
  </fieldset>

  <div class="pitch" id="pitch">
    <button type="button" class="ball" id="ball"
            role="slider"
            aria-labelledby="question"
            aria-valuemin="1" aria-valuemax="5" aria-valuenow="1"
            aria-valuetext="Not set. Move the ball towards the goal.">
      <span class="skin" id="skin"></span>
    </button>
  </div>

  <p class="reading idle" id="reading" role="status"></p>
  <p class="legend" id="legend" hidden><i></i><span>Where you started</span></p>
  <p class="result" id="result"></p>

  <div class="actions">
    <button type="button" class="action" id="submit"></button>
    <button type="button" class="action secondary" id="change" hidden></button>
  </div>

</main>

<script>
(function () {
  "use strict";

  const KEY = "fifa-confidence-v1";

  const pitch    = document.getElementById("pitch");
  const ball     = document.getElementById("ball");
  const skin     = document.getElementById("skin");
  const readEl   = document.getElementById("reading");
  const resultEl = document.getElementById("result");
  const legendEl = document.getElementById("legend");
  const submitBtn= document.getElementById("submit");
  const changeBtn= document.getElementById("change");
  const hint     = document.getElementById("hint");

  document.getElementById("question").textContent = CONFIG.accessibleName;
  submitBtn.textContent = CONFIG.buttonLabel;
  changeBtn.textContent = CONFIG.changeLabel;

  const visibleHeading = document.getElementById("visibleHeading");
  if (CONFIG.question) { visibleHeading.textContent = CONFIG.question; visibleHeading.hidden = false; }
  if (CONFIG.hint) { hint.textContent = CONFIG.hint; hint.hidden = false; }

  const L = CONFIG.levels;
  const n = L.length;

  /* Faint markers at each resting place */
  L.forEach(function (lvl) {
    const s = document.createElement("span");
    s.className = "spot";
    s.style.left = lvl.x + "%";
    s.style.top  = lvl.y + "%";
    pitch.append(s);
  });

  function readEarlier() {
    try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }
    catch (e) { return null; }
  }
  function writeAnswer(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }

  const earlier = CONFIG.mode === "end" ? readEarlier() : null;
  if (earlier && earlier.level && L[earlier.level - 1]) {
    const g = document.createElement("span");
    g.className = "ghost";
    g.style.left = L[earlier.level - 1].x + "%";
    g.style.top  = L[earlier.level - 1].y + "%";
    pitch.append(g);
    legendEl.hidden = false;
  }

  let level = 1;
  let isSet = false;
  let locked = false;

  function place() {
    const lvl = L[level - 1];
    ball.style.left = lvl.x + "%";
    ball.style.top  = lvl.y + "%";
    skin.style.transform = "scale(" + lvl.scale + ")";
    ball.setAttribute("aria-valuenow", String(level));

    if (isSet) {
      ball.classList.add("live");
      ball.setAttribute("aria-valuetext", lvl.label);
      readEl.textContent = lvl.label;
      readEl.classList.remove("idle");
      pitch.classList.add("chosen-level");
    } else {
      ball.setAttribute("aria-valuetext", "Not set. Move the ball towards the goal.");
      readEl.textContent = CONFIG.idlePrompt;
      readEl.classList.add("idle");
    }
  }

  function setLevel(v, commit) {
    if (locked) return;
    const next = Math.max(1, Math.min(n, v));
    if (commit) isSet = true;
    level = next;
    place();
  }

  /* --- Pointer: drag the ball, or tap anywhere on the pitch --- */

  function nearestTo(clientX) {
    const r = pitch.getBoundingClientRect();
    if (!r.width) return level;
    const pct = ((clientX - r.left) / r.width) * 100;
    let best = 1, bestD = Infinity;
    L.forEach(function (lvl, i) {
      const d = Math.abs(lvl.x - pct);
      if (d < bestD) { bestD = d; best = i + 1; }
    });
    return best;
  }

  let dragging = false;

  pitch.addEventListener("pointerdown", function (e) {
    if (locked) return;
    dragging = true;
    ball.classList.add("dragging", "by-pointer");
    ball.focus();
    setLevel(nearestTo(e.clientX), true);
    try { ball.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  window.addEventListener("pointermove", function (e) {
    if (!dragging || locked) return;
    setLevel(nearestTo(e.clientX), true);
    e.preventDefault();
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    ball.classList.remove("dragging");
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  /* --- Keyboard: the single-pointer alternative WCAG 2.2 requires --- */

  ball.addEventListener("keydown", function (e) {
    if (locked) return;
    ball.classList.remove("by-pointer");
    let handled = true;
    switch (e.key) {
      case "ArrowRight": case "ArrowUp":   setLevel(level + 1, true); break;
      case "ArrowLeft":  case "ArrowDown": setLevel(level - 1, true); break;
      case "Home":                         setLevel(1, true); break;
      case "End":                          setLevel(n, true); break;
      default: handled = false;
    }
    if (handled) e.preventDefault();
  });

  submitBtn.addEventListener("click", function () {
    if (!isSet) {
      readEl.textContent = "Move the ball first.";
      ball.focus();
      return;
    }

    const label = L[level - 1].label;

    if (CONFIG.mode === "start") {
      writeAnswer({ level: level, label: label, at: new Date().toISOString() });
      resultEl.textContent = CONFIG.msgRecorded;
    } else if (!earlier || !earlier.level) {
      resultEl.textContent = CONFIG.endNoData;
    } else {
      const tpl = level > earlier.level ? CONFIG.endUp
                : level < earlier.level ? CONFIG.endDown
                : CONFIG.endSame;
      resultEl.textContent = tpl
        .replace("{before}", earlier.label)
        .replace("{now}", label);
      writeAnswer({ level: earlier.level, label: earlier.label,
                    endLevel: level, endLabel: label,
                    at: new Date().toISOString() });
    }

    locked = true;
    ball.setAttribute("aria-disabled", "true");
    pitch.style.cursor = "default";
    submitBtn.hidden = true;
    changeBtn.hidden = false;
    resultEl.setAttribute("tabindex", "-1");
    resultEl.focus();
  });

  changeBtn.addEventListener("click", function () {
    locked = false;
    ball.removeAttribute("aria-disabled");
    pitch.style.cursor = "pointer";
    resultEl.textContent = "";
    resultEl.removeAttribute("tabindex");
    changeBtn.hidden = true;
    submitBtn.hidden = false;
    ball.focus();
  });

  place();
})();
</script>
</body>
</html>
