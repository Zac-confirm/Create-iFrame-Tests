<style>
/* ============================================================
   BRAND TOKENS — black and white to match the line art.
   ============================================================ */
:root {
  --paper:  #FFFFFF;
  --ink:    #111111;
  --soft:   #6B6B6B;
  --faint:  #C9C9C9;
  --before: #111111;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(0.9375rem, 0.92rem + 0.1vw, 1rem);
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.stage {
  max-width: 54rem;
  min-height: 100%;
  margin: 0 auto;
  padding: clamp(0.6rem, 2vw, 1.2rem) clamp(0.8rem, 3vw, 1.5rem);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(0.4rem, 1.4vw, 0.7rem);
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
  white-space: nowrap; border: 0;
}

.prompt { border: 0; margin: 0; padding: 0; min-width: 0; }

.visible-heading {
  margin: 0;
  font-size: clamp(1.15rem, 1rem + 0.75vw, 1.6rem);
  font-weight: 600; line-height: 1.2; letter-spacing: -0.01em;
  max-width: 38ch;
}

.hint { margin: 0.5rem 0 0; color: var(--soft); }

/* ---------- Player and dial, side by side ---------- */

.rig {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: clamp(0.5rem, 2vw, 1.5rem);
}

.player {
  position: relative;
  height: min(54vh, 19rem);
  aspect-ratio: 360 / 765;
  margin: 0 auto;
}

.frame {
  position: absolute;
  inset: 0;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: bottom center;
  opacity: 0;
  transition: opacity 220ms ease;
}

/* ---------- The dial ---------- */

.dial-wrap {
  position: relative;
  width: min(100%, 42vh, 11rem);
  margin: 0 auto;
  aspect-ratio: 1;
  touch-action: none;
}

.dial {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  margin: 0; padding: 0;
  border: 0;
  background: transparent;
  cursor: grab;
  border-radius: 50%;
}

.dial:active { cursor: grabbing; }
.dial:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.dial.by-pointer:focus-visible { outline: none; }

.dial svg { width: 100%; height: 100%; display: block; overflow: visible; }

.face-ring { fill: none; stroke: var(--faint); stroke-width: 2; }
.tick      { stroke: var(--faint); stroke-width: 3; stroke-linecap: round; }
.tick.past { stroke: var(--ink); }
.needle    { stroke: var(--ink); stroke-width: 4; stroke-linecap: round;
             transition: transform 420ms cubic-bezier(.34,.62,.28,1);
             transform-origin: 100px 100px; }
.hub       { fill: var(--paper); stroke: var(--faint); stroke-width: 2; }
.knob      { fill: var(--paper); stroke: var(--ink); stroke-width: 4;
             transition: transform 420ms cubic-bezier(.34,.62,.28,1);
             transform-origin: 100px 100px; }
.dial.dragging .needle, .dial.dragging .knob { transition: none; }

.dial-num {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(1.5rem, 1.2rem + 1.6vw, 2.4rem);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}

.dial-num.idle { color: var(--faint); }

/* Their earlier answer, marked on the dial face */
.was-tick { stroke: var(--before); stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 3 4; }

.reading {
  margin: 0;
  min-height: 1.55em;
  font-weight: 600;
  font-size: clamp(1.05rem, 0.95rem + 0.5vw, 1.35rem);
  text-align: center;
}
.reading.idle { font-weight: 400; color: var(--soft); font-size: 1em; }

.legend {
  margin: 0; font-size: 0.82em; color: var(--soft);
  display: flex; align-items: center; justify-content: center; gap: 0.4rem;
}
.legend i { width: 0.9rem; height: 0; border-top: 3px dashed var(--before); flex: 0 0 auto; }

.result { margin: 0 auto; max-width: 52ch; font-size: 0.95em; text-align: center; }

.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }

button.action {
  font: inherit; font-weight: 600;
  color: var(--paper); background: var(--ink);
  border: 2px solid var(--ink); border-radius: 0.3rem;
  padding: 0.55rem 1.1rem; min-height: 2.6rem; cursor: pointer;
}
button.action.secondary { color: var(--ink); background: transparent; }
button.action:hover { opacity: 0.85; }
button.action:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

[hidden] { display: none !important; }



@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>
</head>

<body>
<main class="stage">

  <fieldset class="prompt">
    <legend id="question" class="sr-only"></legend>
    <p class="visible-heading" id="visibleHeading" hidden></p>
    <p class="hint" id="hint" hidden></p>
  </fieldset>

  <div class="rig">
    <!-- Decorative: the dial's value carries the meaning -->
    <div class="player" id="player" role="presentation"></div>

    <div class="dial-wrap">
      <button type="button" class="dial" id="dial"
              role="slider"
              aria-labelledby="question"
              aria-valuemin="1" aria-valuemax="5" aria-valuenow="1"
              aria-valuetext="Not set. Turn the dial.">
        <svg viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <circle class="face-ring" cx="100" cy="100" r="78"/>
          <g id="ticks"></g>
          <g id="wasMark"></g>
          <line class="needle" id="needle" x1="100" y1="72" x2="100" y2="40"/>
          <circle class="hub" cx="100" cy="100" r="26"/>
          <circle class="knob" id="knob" cx="100" cy="30" r="9"/>
        </svg>
      </button>
      <span class="dial-num idle" id="dialNum" aria-hidden="true">1</span>
    </div>
  </div>

  <p class="reading idle" id="reading" role="status"></p>
  <p class="legend" id="legend" hidden><i></i><span>Where you started</span></p>
  <p class="result" id="result"></p>

  <div class="actions">
    <button type="button" class="action" id="submit"></button>
    <button type="button" class="action secondary" id="change" hidden></button>
  </div>

</main>

<script>
(function () {
  "use strict";

  const KEY = "fifa-confidence-v1";

  const player   = document.getElementById("player");
  const dial     = document.getElementById("dial");
  const needle   = document.getElementById("needle");
  const knob     = document.getElementById("knob");
  const ticksG   = document.getElementById("ticks");
  const wasG     = document.getElementById("wasMark");
  const numEl    = document.getElementById("dialNum");
  const readEl   = document.getElementById("reading");
  const resultEl = document.getElementById("result");
  const legendEl = document.getElementById("legend");
  const submitBtn= document.getElementById("submit");
  const changeBtn= document.getElementById("change");
  const hint     = document.getElementById("hint");

  document.getElementById("question").textContent = CONFIG.accessibleName;
  submitBtn.textContent = CONFIG.buttonLabel;
  changeBtn.textContent = CONFIG.changeLabel;

  const visibleHeading = document.getElementById("visibleHeading");
  if (CONFIG.question) { visibleHeading.textContent = CONFIG.question; visibleHeading.hidden = false; }
  if (CONFIG.hint) { hint.textContent = CONFIG.hint; hint.hidden = false; }

  const n = CONFIG.levels.length;
  const SWEEP = 240;                 /* degrees the dial turns through */
  const START = -SWEEP / 2;          /* level 1 sits here, 12 o'clock is 0 */

  function angleFor(level) { return START + (level - 1) * (SWEEP / (n - 1)); }

  /* Build the frames */
  const frames = [];
  for (let i = 1; i <= n; i++) {
    const f = document.createElement("span");
    f.className = "frame f" + i;
    player.append(f);
    frames.push(f);
  }

  /* Build the tick marks */
  const ticks = [];
  for (let i = 1; i <= n; i++) {
    const a = (angleFor(i) - 90) * Math.PI / 180;
    const t = document.createElementNS("http://www.w3.org/2000/svg", "line");
    t.setAttribute("class", "tick");
    t.setAttribute("x1", (100 + Math.cos(a) * 62).toFixed(1));
    t.setAttribute("y1", (100 + Math.sin(a) * 62).toFixed(1));
    t.setAttribute("x2", (100 + Math.cos(a) * 72).toFixed(1));
    t.setAttribute("y2", (100 + Math.sin(a) * 72).toFixed(1));
    ticksG.append(t);
    ticks.push(t);
  }

  function readEarlier() {
    try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }
    catch (e) { return null; }
  }
  function writeAnswer(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }

  const earlier = CONFIG.mode === "end" ? readEarlier() : null;
  if (earlier && earlier.level) {
    const a = (angleFor(earlier.level) - 90) * Math.PI / 180;
    const m = document.createElementNS("http://www.w3.org/2000/svg", "line");
    m.setAttribute("class", "was-tick");
    m.setAttribute("x1", (100 + Math.cos(a) * 78).toFixed(1));
    m.setAttribute("y1", (100 + Math.sin(a) * 78).toFixed(1));
    m.setAttribute("x2", (100 + Math.cos(a) * 92).toFixed(1));
    m.setAttribute("y2", (100 + Math.sin(a) * 92).toFixed(1));
    wasG.append(m);
    legendEl.hidden = false;
  }

  let level = 1;
  let isSet = false;
  let locked = false;

  function place() {
    const deg = angleFor(level);
    needle.style.transform = "rotate(" + deg + "deg)";
    knob.style.transform = "rotate(" + deg + "deg)";
    numEl.textContent = String(level);
    dial.setAttribute("aria-valuenow", String(level));

    frames.forEach(function (f, i) { f.classList.toggle("on", i === level - 1); });
    ticks.forEach(function (t, i) { t.classList.toggle("past", isSet && i < level); });

    if (isSet) {
      dial.setAttribute("aria-valuetext", CONFIG.levels[level - 1]);
      readEl.textContent = CONFIG.levels[level - 1];
      readEl.classList.remove("idle");
      numEl.classList.remove("idle");
    } else {
      dial.setAttribute("aria-valuetext", "Not set. Turn the dial.");
      readEl.textContent = CONFIG.idlePrompt;
      readEl.classList.add("idle");
      numEl.classList.add("idle");
    }
  }

  function setLevel(v, commit) {
    if (locked) return;
    const next = Math.max(1, Math.min(n, v));
    if (commit) isSet = true;
    level = next;
    place();
  }

  /* --- Pointer: turn the dial --- */

  function levelFromPoint(cx, cy) {
    const r = dial.getBoundingClientRect();
    const dx = cx - (r.left + r.width / 2);
    const dy = cy - (r.top + r.height / 2);
    let deg = Math.atan2(dx, -dy) * 180 / Math.PI;   /* 0 at 12 o'clock */
    const lo = angleFor(1), hi = angleFor(n);
    if (deg < lo) deg = lo;
    if (deg > hi) deg = hi;
    return Math.round((deg - lo) / (SWEEP / (n - 1))) + 1;
  }

  let dragging = false;

  dial.addEventListener("pointerdown", function (e) {
    if (locked) return;
    dragging = true;
    dial.classList.add("dragging", "by-pointer");
    dial.focus();
    setLevel(levelFromPoint(e.clientX, e.clientY), true);
    try { dial.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  window.addEventListener("pointermove", function (e) {
    if (!dragging || locked) return;
    setLevel(levelFromPoint(e.clientX, e.clientY), true);
    e.preventDefault();
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    dial.classList.remove("dragging");
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  /* --- Keyboard: the alternative WCAG 2.2 requires for any drag --- */

  dial.addEventListener("keydown", function (e) {
    if (locked) return;
    dial.classList.remove("by-pointer");
    let handled = true;
    switch (e.key) {
      case "ArrowRight": case "ArrowUp":   setLevel(level + 1, true); break;
      case "ArrowLeft":  case "ArrowDown": setLevel(level - 1, true); break;
      case "Home":                         setLevel(1, true); break;
      case "End":                          setLevel(n, true); break;
      default: handled = false;
    }
    if (handled) e.preventDefault();
  });

  submitBtn.addEventListener("click", function () {
    if (!isSet) {
      readEl.textContent = "Turn the dial first.";
      dial.focus();
      return;
    }

    const label = CONFIG.levels[level - 1];

    if (CONFIG.mode === "start") {
      writeAnswer({ level: level, label: label, at: new Date().toISOString() });
      resultEl.textContent = CONFIG.msgRecorded;
    } else if (!earlier || !earlier.level) {
      resultEl.textContent = CONFIG.endNoData;
    } else {
      const tpl = level > earlier.level ? CONFIG.endUp
                : level < earlier.level ? CONFIG.endDown
                : CONFIG.endSame;
      resultEl.textContent = tpl
        .replace("{before}", earlier.label)
        .replace("{now}", label);
      writeAnswer({ level: earlier.level, label: earlier.label,
                    endLevel: level, endLabel: label,
                    at: new Date().toISOString() });
    }

    locked = true;
    dial.setAttribute("aria-disabled", "true");
    dial.style.cursor = "default";
    submitBtn.hidden = true;
    changeBtn.hidden = false;
    resultEl.setAttribute("tabindex", "-1");
    resultEl.focus();
  });

  changeBtn.addEventListener("click", function () {
    locked = false;
    dial.removeAttribute("aria-disabled");
    dial.style.cursor = "grab";
    resultEl.textContent = "";
    resultEl.removeAttribute("tabindex");
    changeBtn.hidden = true;
    submitBtn.hidden = false;
    dial.focus();
  });

  place();
})();
</script>
</body>
</html>
